<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница</title>
    <style>
        /* Общие веселые стили с зеленым градиентом */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Контейнер-карточка */
        .card {
            background: white;
            padding: 40px 60px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 5px solid #ffde17; /* Яркий желтый акцент */
            transform: rotate(-1deg);
            transition: transform 0.3s ease;
            max-width: 90%;
        }

        .card:hover {
            transform: rotate(1deg) scale(1.02);
        }

        /* Прыгающие буквы для главного заголовка */
        h1 {
            font-size: 3rem;
            color: #333;
            margin: 0 0 20px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        h1 span {
            display: inline-block;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }

        /* Разные сочные цвета для букв */
        h1 span:nth-child(4n+1) { color: #ff4757; }
        h1 span:nth-child(4n+2) { color: #2ed573; }
        h1 span:nth-child(4n+3) { color: #1e90ff; }
        h1 span:nth-child(4n+4) { color: #ffa502; }

        /* Задержка анимации, чтобы буквы прыгали волной */
        h1 span:nth-child(1)  { animation-delay: 0.1s; }
        h1 span:nth-child(2)  { animation-delay: 0.2s; }
        h1 span:nth-child(3)  { animation-delay: 0.3s; }
        h1 span:nth-child(4)  { animation-delay: 0.4s; }
        h1 span:nth-child(5)  { animation-delay: 0.5s; }
        h1 span:nth-child(6)  { animation-delay: 0.6s; }
        h1 span:nth-child(7)  { animation-delay: 0.7s; }
        h1 span:nth-child(8)  { animation-delay: 0.8s; }
        h1 span:nth-child(9)  { animation-delay: 0.9s; }
        h1 span:nth-child(10) { animation-delay: 1.0s; }
        h1 span:nth-child(11) { animation-delay: 1.1s; }
        h1 span:nth-child(12) { animation-delay: 1.2s; }
        h1 span:nth-child(13) { animation-delay: 1.3s; }
        h1 span:nth-child(14) { animation-delay: 1.4s; }
        h1 span:nth-child(15) { animation-delay: 1.5s; }
        h1 span:nth-child(16) { animation-delay: 1.6s; }
        h1 span:nth-child(17) { animation-delay: 1.7s; }

        /* Подзаголовок */
        p {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2ed573;
            margin: 0;
        }

        /* Веселый вращающийся клевер */
        .emoji {
            font-size: 4rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: spin 3s linear infinite;
        }

        /* Анимация прыжка */
        @keyframes bounce {
            100% {
                transform: translateY(-20px);
            }
        }

        /* Анимация вращения смайлика */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🍀</div>
        <h1>
            <span>Т</span><span>е</span><span>с</span><span>т</span><span>о</span><span>в</span><span>а</span><span>я</span><span>&nbsp;</span><span>с</span><span>т</span><span>р</span><span>а</span><span>н</span><span>и</span><span>ц</span><span>а</span>
        </h1>
        <p>Ура! Все работает!</p>
    </div>

</body>
</html>
