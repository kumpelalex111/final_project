apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: gitlab-registry-secret
      containers:
      - name: app-v1
        image:  __IMAGE_PLACEHOLDER__
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: default
spec:
  type: NodePort 
  selector:
    app: backend
  ports:
    - name: app-v1
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30002 

