stages:
  - build
  - deploy

variables:
  GITLAB_REGISTRY: "192.168.50.17:5050"
  COMMIT_IMAGE: "$GITLAB_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
  TAG_IMAGE: "$GITLAB_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_TAG"

.build_template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - app
  before_script:
    # Создаем директорию для конфигурации Docker-авторизации внутри Kaniko
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$GITLAB_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    # Запуск сборки. Флаг --insecure принудительно разрешает работу по HTTP
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${TARGET_IMAGE}" --insecure

build_commit:
  extends: .build_template
  variables:
    TARGET_IMAGE: "$COMMIT_IMAGE"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

build_tag:
  extends: .build_template
  variables:
    TARGET_IMAGE: "$TAG_IMAGE"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

deploy_to_k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - app
  script:
    - sed -i "s|__IMAGE_PLACEHOLDER__|${TAG_IMAGE}|g" deployment-backend.yaml
    - kubectl apply -f deployment-backend.yaml -n default
    - sleep 15
    - kubectl get pods -n default -l app=backend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
